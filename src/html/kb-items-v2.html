<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — Climber Trade</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0A0A0A;--surface:#0d0d0d;--card:#131313;--card2:#161616;
  --border:#1c1c1c;--border2:#222;
  --teal:#00D4FF;--teal-dim:#00D4FF15;
  --green:#10B981;--red:#EF4444;--amber:#F59E0B;
  --text:#F0F0F0;--text2:#8A8A8A;--text3:#444;
  --font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;}
/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:60px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,.95);backdrop-filter:blur(12px);
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{
  width:32px;height:32px;background:linear-gradient(135deg,#00D4FF22,#00D4FF08);
  border:1px solid #00D4FF33;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.logo-text{font-size:14px;font-weight:700;letter-spacing:-.2px;}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;}
.header-badge{
  display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;
  border:1px solid var(--border2);font-size:11px;color:var(--text2);
}
.header-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
/* Layout */
.layout{display:grid;grid-template-columns:256px 1fr;height:calc(100vh - 60px);}
/* Sidebar */
.sidebar{
  border-right:1px solid var(--border);overflow-y:auto;
  background:var(--surface);
}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:#1c1c1c;}
.pillar-section{padding:20px 14px 8px;}
.pillar-section:first-child{padding-top:24px;}
.pillar-header{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 4px;
}
.pillar-indicator{
  width:3px;height:28px;border-radius:2px;flex-shrink:0;
}
.pillar-info{}
.pillar-label{font-size:10px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--text3);display:block;}
.pillar-coeff{font-size:9px;color:var(--text3);font-family:var(--mono);}
.item-btn{
  display:flex;align-items:center;gap:8px;
  width:100%;text-align:left;padding:8px 10px;
  font-size:12px;font-family:var(--font);color:var(--text2);
  background:none;border:none;cursor:pointer;border-radius:6px;
  transition:all .12s;margin-bottom:1px;
}
.item-btn:hover{color:var(--text);background:var(--card);}
.item-btn.active{color:var(--teal);background:var(--teal-dim);}
.item-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0;opacity:.4;}
.item-btn.active .item-dot{opacity:1;}
/* Main */
.main{overflow-y:auto;padding:36px 40px;}
.main::-webkit-scrollbar{width:3px;}
.main::-webkit-scrollbar-thumb{background:#1c1c1c;}
.panel{display:none;animation:fi .2s ease;}
.panel.active{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* Metric top */
.metric-top{margin-bottom:32px;}
.pillar-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 14px;border-radius:20px;
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  margin-bottom:14px;
}
.chip-dot{width:6px;height:6px;border-radius:50%;}
.metric-title{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-bottom:14px;}
.metric-lead{
  font-size:14px;color:var(--text2);line-height:1.8;max-width:620px;
  padding:16px 20px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;
  border-left:3px solid var(--teal);
}
/* Section */
.section{margin-bottom:28px;}
.section-header{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
}
.sh-label{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);white-space:nowrap;}
.sh-line{flex:1;height:1px;background:var(--border);}
/* Description block */
.desc-block{
  font-size:13px;color:var(--text2);line-height:1.8;
  max-width:640px;
}
/* Examples grid */
.examples-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.example-card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:16px 18px;
}
.ex-label{font-size:10px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;}
.ex-value{font-size:22px;font-weight:700;font-family:var(--mono);color:var(--teal);margin-bottom:8px;letter-spacing:-.5px;}
.ex-detail{font-size:12px;color:var(--text2);line-height:1.6;}
/* Improvements */
.improvements{display:flex;flex-direction:column;gap:10px;max-width:640px;}
.improve-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:10px 14px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);
  font-size:13px;color:var(--text2);line-height:1.6;
}
.improve-arrow{
  width:18px;height:18px;border-radius:4px;
  background:#00D4FF18;flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;color:var(--teal);font-weight:700;
}
/* Thresholds */
.thresholds{display:flex;flex-direction:column;gap:8px;max-width:600px;}
.threshold{
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;border-radius:8px;border:1px solid;
}
.threshold.Critical{border-color:#EF444433;background:#EF44440a;}
.threshold.Needs{border-color:#F59E0B33;background:#F59E0B0a;}
.threshold.Excellent{border-color:#10B98133;background:#10B9810a;}
.thresh-badge{
  font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  padding:3px 8px;border-radius:4px;white-space:nowrap;flex-shrink:0;
}
.Critical .thresh-badge{background:#EF44441a;color:#EF4444;}
.Needs .thresh-badge{background:#F59E0B1a;color:#F59E0B;}
.Excellent .thresh-badge{background:#10B9811a;color:#10B981;}
.thresh-content{flex:1;}
.thresh-value{font-size:13px;font-weight:600;font-family:var(--mono);color:var(--text);margin-bottom:2px;}
.thresh-desc{font-size:12px;color:var(--text2);}
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <div class="logo-icon">🏔</div>
    <div>
      <div class="logo-text">Climber Trade</div>
      <div class="logo-sub">KNOWLEDGE BASE</div>
    </div>
  </div>
  <div class="header-badge">CLIMB Score · Educational Guide</div>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

  {id:"R_T_AFD",pillar:"risk",name:"Recovery Time After Drawdown",lead:"How quickly do you bounce back after a loss? Tracks the number of trading days it takes for your account to recover to its previous equity high. The score adapts to the drawdown size — larger drawdowns are expected to take longer.",sections:[

    {type:"examples",title:"Examples",examples:[

    {type:"improve",title:"How to Improve",improvements:["Start with reduced position sizes and only scale up after strategy proves profitable","Avoid going for big wins early — focus on consistency first","Treat the first weeks as a calibration period, not a sprint"]},

  ]},
  {id:"MDD",pillar:"risk",name:"Maximum Drawdown",lead:"The largest peak-to-trough drop in your account equity. The single most important risk metric — it shows the worst decline from any high point to the following low. This is an informational metric — displayed for reference.",sections:[

  {id:"PI2",pillar:"perf",name:"Annualized Yield",lead:"Your annualized return projected over a full year. Includes a confidence factor that adjusts the score based on how long you've been trading — so short track records don't get inflated scores. Score 50 = 8% benchmark.",sections:[

  {id:"SHARPE",pillar:"perf",name:"Sharpe Ratio",lead:"The gold standard for measuring the quality of your returns. Are your profits worth the risk you're taking? A high Sharpe means returns are smooth and consistent relative to volatility. Provides up to +10 bonus pts.",sections:[

    {type:"improve",title:"How to Improve",improvements:["Be more selective — quality entries over quantity","Wait for multiple confirmation signals before entering","Avoid impulsive trades that bring down your average"]},

  {id:"CT2",pillar:"cons",name:"Days in Gain",lead:"The percentage of trading days that end positive. The simplest metric in the system: 60% green days = 60 points. Direct 1:1 mapping — no multiplier, no confidence factor.",sections:[

    {type:"examples",title:"Examples",examples:[

      {label:"Inconsistent Trader",value:"40%",detail:"More red days than green — review daily routine and risk controls"}]},

      {label:"Clean Profile",value:"Kurtosis < 1",detail:"Very few outliers — smooth, predictable results"},
      {label:"Spiky Profile",value:"Kurtosis > 4",detail:"Frequent extreme days — sudden drawdowns or windfall profits"}]},
    {type:"improve",title:"How to Improve",improvements:["Reduce exposure during major news events and low-liquidity periods","Set strict daily limits (both profit and loss) to cut the tails","Keep your position sizing constant — don't go 'all-in' on any setup"]},
    {type:"thresholds",title:"Thresholds",thresholds:[{level:"Critical",value:"> 4",desc:"Unstable — frequent extreme events"},{level:"Needs",value:"2–4",desc:"Occasional spikes — work on consistency"},{level:"Excellent",value:"< 2",desc:"Smooth, predictable performance"}]}
  ]}
];
const ORDER=["risk","perf","cons","qual"];
const sidebar=document.getElementById('sidebar');
const main=document.getElementById('main');
let first=null;
ORDER.forEach(pillar=>{
  const items=KB.filter(k=>k.pillar===pillar);
  if(!items.length)return;
  const p=PC[pillar];
  const sec=document.createElement('div');
  sec.className='pillar-section';
  sec.innerHTML=`<div class="pillar-header">
    <div class="pillar-indicator" style="background:linear-gradient(180deg,${p.color},${p.color}44)"></div>
    <div class="pillar-info">
      <span class="pillar-label">${p.label}</span>
      <span class="pillar-coeff">coefficient ×${p.coeff}</span>
    </div>
  </div>`;
  items.forEach(item=>{
    const btn=document.createElement('button');
    btn.className='item-btn';
    btn.innerHTML=`<span class="item-dot"></span>${item.name}`;
    btn.onclick=()=>{
      document.querySelectorAll('.item-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(pp=>pp.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('kb-'+item.id).classList.add('active');
    };
    sec.appendChild(btn);
    if(!first)first={btn,id:item.id};
    const panel=document.createElement('div');
    panel.id='kb-'+item.id;
    panel.className='panel';
    let html=`<div class="metric-top">
      <div class="pillar-chip" style="background:${p.color}18;color:${p.color};border:1px solid ${p.color}33">
        <div class="chip-dot" style="background:${p.color}"></div>
        ${p.label} &nbsp;·&nbsp; ×${p.coeff}
      </div>
      <div class="metric-title">${item.name}</div>
      <div class="metric-lead">${item.lead}</div>
    </div>`;
    item.sections.forEach(s=>{
      html+=`<div class="section"><div class="section-header"><div class="sh-label">${s.title}</div><div class="sh-line"></div></div>`;
      if(s.type==='reveals'||s.type==='description'){
        html+=`<div class="desc-block">${s.content}</div>`;
      } else if(s.type==='examples'){
        html+=`<div class="examples-grid">${s.examples.map(e=>`<div class="example-card">
          <div class="ex-label">${e.label}</div>
          <div class="ex-value">${e.value}</div>
          <div class="ex-detail">${e.detail}</div>
        </div>`).join('')}</div>`;
      } else if(s.type==='improve'){
        html+=`<div class="improvements">${s.improvements.map(i=>`<div class="improve-item">
          <div class="improve-arrow">→</div><span>${i}</span>
        </div>`).join('')}</div>`;
      } else if(s.type==='thresholds'){
        html+=`<div class="thresholds">${s.thresholds.map(t=>`<div class="threshold ${t.level}">
          <span class="thresh-badge">${t.level==='Needs'?'Needs Work':t.level}</span>
          <div class="thresh-content">
            <div class="thresh-value">${t.value}</div>
            <div class="thresh-desc">${t.desc}</div>
          </div>
        </div>`).join('')}</div>`;
      }
      html+=`</div>`;
    });
    panel.innerHTML=html;
    main.appendChild(panel);
  });
  sidebar.appendChild(sec);
});
if(first){
  document.getElementById('kb-'+first.id).classList.add('active');
  first.btn.classList.add('active');
}
</script>
</body>
</html>
