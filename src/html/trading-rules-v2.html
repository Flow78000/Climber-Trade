<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="fonts/fonts.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Rules — Climber Trade</title>
<style>

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0A0A0A;--surface:#0d0d0d;--card:#131313;--card2:#161616;
  --border:#1c1c1c;--border2:#222;
  --teal:#00D4FF;--teal-dim:#00D4FF15;
  --green:#10B981;--red:#EF4444;--amber:#F59E0B;--purple:#8B5CF6;
  --text:#F0F0F0;--text2:#8A8A8A;--text3:#444;
  --font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;}
/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:60px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,.95);backdrop-filter:blur(12px);
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{
  width:32px;height:32px;background:linear-gradient(135deg,#00D4FF22,#00D4FF08);
  border:1px solid #00D4FF33;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.logo-text{font-size:14px;font-weight:700;letter-spacing:-.2px;}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;}
.header-badge{
  display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;
  border:1px solid var(--border2);font-size:11px;color:var(--text2);
}
.header-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
/* Layout */
.layout{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 60px);}
/* Sidebar */
.sidebar{
  border-right:1px solid var(--border);overflow-y:auto;
  background:var(--surface);padding:20px 12px;
}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:#1c1c1c;}
.sidebar-title{
  font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--text3);padding:0 8px;margin-bottom:12px;
}
.nav-btn{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;padding:10px 12px;
  font-size:12px;font-weight:500;font-family:var(--font);color:var(--text2);
  background:none;border:none;cursor:pointer;border-radius:8px;
  transition:all .12s;margin-bottom:2px;
}
.nav-btn:hover{color:var(--text);background:var(--card);}
.nav-btn.active{color:var(--teal);background:var(--teal-dim);}
.nav-icon{
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;
}
.nav-btn.active .nav-icon{border-color:var(--teal)44;}
.nav-label{font-size:12px;font-weight:600;}
.nav-sub{font-size:10px;color:var(--text3);font-weight:400;}
/* Main */
.main{overflow-y:auto;padding:32px 36px;}
.main::-webkit-scrollbar{width:3px;}
.main::-webkit-scrollbar-thumb{background:#1c1c1c;}
.panel{display:none;animation:fi .2s ease;}
.panel.active{display:block;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
/* Section header */
.section-top{margin-bottom:28px;}
.section-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 14px;border-radius:20px;
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  margin-bottom:14px;
}
.chip-dot{width:6px;height:6px;border-radius:50%;}
.section-title{font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:12px;}
.section-lead{
  font-size:13px;color:var(--text2);line-height:1.8;max-width:640px;
  padding:14px 18px;background:var(--card);
  border:1px solid var(--border);border-radius:10px;
  border-left:3px solid var(--teal);
}
/* Divider */
.divider{display:flex;align-items:center;gap:10px;margin:28px 0 16px;}
.div-label{font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text3);white-space:nowrap;}
.div-line{flex:1;height:1px;background:var(--border);}
/* Cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:20px;}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:18px 20px;
}
.card-label{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.card-value{font-size:24px;font-weight:800;font-family:var(--mono);letter-spacing:-1px;margin-bottom:6px;}
.card-desc{font-size:12px;color:var(--text2);line-height:1.6;}
/* Stat row */
.stat-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.stat-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);
}
.stat-icon{
  width:32px;height:32px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;
}
.stat-content{flex:1;}
.stat-key{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px;}
.stat-val{font-size:11px;color:var(--text2);}
.stat-badge{
  font-size:10px;font-weight:700;letter-spacing:.3px;
  padding:4px 10px;border-radius:5px;white-space:nowrap;
}
/* Tables */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.table-title{
  padding:12px 16px;font-size:10px;font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;color:var(--text3);
  border-bottom:1px solid var(--border);background:var(--card2);
}
table{width:100%;border-collapse:collapse;}
th{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text3);padding:10px 16px;text-align:left;
  border-bottom:1px solid var(--border);background:var(--card2);
}
td{padding:10px 16px;border-bottom:1px solid #0f0f0f;font-size:12px;color:var(--text2);}
tr:last-child td{border:none;}
tr:hover td{background:#111;}
.td-mono{font-family:var(--mono);font-weight:500;}
.td-green{color:var(--green);font-weight:600;}
.td-red{color:var(--red);font-weight:600;}
.td-amber{color:var(--amber);font-weight:600;}
/* Badge */
.badge{
  display:inline-block;padding:3px 10px;border-radius:5px;
  font-size:10px;font-weight:700;letter-spacing:.3px;
}
.badge-green{background:#10B98118;color:var(--green);border:1px solid #10B98133;}
.badge-red{background:#EF444418;color:var(--red);border:1px solid #EF444433;}
.badge-amber{background:#F59E0B18;color:var(--amber);border:1px solid #F59E0B33;}
.badge-teal{background:var(--teal-dim);color:var(--teal);border:1px solid #00D4FF33;}
.badge-purple{background:#8B5CF618;color:var(--purple);border:1px solid #8B5CF633;}
/* Tag list */
.tag-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.tag{
  padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;
  background:var(--card);border:1px solid var(--border);color:var(--text2);
}
.tag-green{border-color:#10B98133;color:var(--green);}
.tag-red{border-color:#EF444433;color:var(--red);}
/* Info block */
.info-block{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:18px 22px;margin-bottom:16px;
}
.info-block p{font-size:13px;color:var(--text2);line-height:1.8;}
/* Steps */
.steps{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.step{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 18px;border-radius:8px;
  background:var(--card);border:1px solid var(--border);
}
.step-num{
  width:28px;height:28px;border-radius:6px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;font-family:var(--mono);
  background:var(--teal-dim);color:var(--teal);border:1px solid #00D4FF33;
}
.step-content{flex:1;}
.step-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;}
.step-desc{font-size:12px;color:var(--text2);line-height:1.6;}
/* Two-col */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;}
/* Severity scale */
.severity{
  display:flex;align-items:stretch;gap:0;border-radius:10px;overflow:hidden;
  border:1px solid var(--border);margin-bottom:20px;
}
.sev-block{flex:1;padding:18px 16px;text-align:center;}
.sev-block:not(:last-child){border-right:1px solid var(--border);}
.sev-level{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;}
.sev-time{font-size:16px;font-weight:700;font-family:var(--mono);margin-bottom:6px;}
.sev-desc{font-size:11px;color:var(--text2);line-height:1.5;}
</style>
</head>
<body>
<div class="header">
  <div class="logo">
    <div class="logo-icon">🏔</div>
    <div>
      <div class="logo-text">Climber Trade</div>
      <div class="logo-sub">TRADING RULES</div>
    </div>
  </div>
  <div class="header-badge">Evaluation & Live — March 2026</div>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title">Rule Sections</div>
  </div>
  <div class="main" id="main"></div>
</div>

const sidebar=document.getElementById('sidebar');
const main=document.getElementById('main');
SECTIONS.forEach((sec,i)=>{
  const btn=document.createElement('button');
  btn.className='nav-btn'+(i===0?' active':'');
  btn.innerHTML=`
    <div class="nav-icon" style="background:${sec.color}18;border:1px solid ${sec.color}33">${sec.icon}</div>
    <div><div class="nav-label">${sec.label}</div><div class="nav-sub">${sec.sub}</div></div>`;
  btn.onclick=()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sec-'+sec.id).classList.add('active');
  };
  sidebar.appendChild(btn);
  const panel=document.createElement('div');
  panel.id='sec-'+sec.id;
  panel.className='panel'+(i===0?' active':'');
  panel.innerHTML=sec.render();
  main.appendChild(panel);
});
</script>
