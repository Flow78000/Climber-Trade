<style>

*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0A0A0A;--surface:#0f0f0f;--card:#131313;--card2:#161616;
  --border:#1c1c1c;--border2:#222;
  --teal:#00D4FF;--teal-dim:#00D4FF18;
  --green:#10B981;--text:#F0F0F0;--text2:#9A9A9A;--text3:#444;
  --font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;
  --r:8px;--r2:12px;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;}
/* Header */
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:60px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;
  background:rgba(10,10,10,.95);backdrop-filter:blur(12px);
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{
  width:32px;height:32px;background:linear-gradient(135deg,#00D4FF22,#00D4FF08);
  border:1px solid #00D4FF33;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.logo-text{font-size:14px;font-weight:700;letter-spacing:-.2px;}
.logo-sub{font-size:10px;color:var(--text3);letter-spacing:.5px;}
.header-right{display:flex;align-items:center;gap:12px;}
.header-badge{
  display:flex;align-items:center;gap:6px;padding:4px 12px;
  border-radius:20px;border:1px solid var(--border2);font-size:11px;color:var(--text2);
}
.header-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);}
/* Exchange tabs */
.exchange-tabs{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  padding:0 28px;background:var(--surface);overflow-x:auto;
}
.ex-tab{
  display:flex;align-items:center;gap:8px;
  padding:14px 20px;font-size:12px;font-weight:600;
  cursor:pointer;border-bottom:2px solid transparent;
  color:var(--text2);white-space:nowrap;transition:all .15s;letter-spacing:.3px;
}
.ex-tab:hover{color:var(--text);}
.ex-tab.active{color:var(--text);border-bottom-color:var(--teal);}
.ex-dot{width:8px;height:8px;border-radius:50%;}
.ex-count{
  font-size:10px;font-family:var(--mono);
  padding:1px 6px;border-radius:3px;background:var(--card2);
  color:var(--text3);
}
/* Content */
.content{padding:28px;max-width:1300px;}
.panel{display:none;animation:fadeIn .2s ease;}
.panel.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.exchange-hero{
  display:flex;align-items:center;gap:16px;
  margin-bottom:24px;padding:20px 24px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r2);
}
.exchange-emblem{
  width:48px;height:48px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;font-family:var(--mono);letter-spacing:-.5px;
}
.exchange-info h2{font-size:16px;font-weight:700;margin-bottom:2px;}
.exchange-info p{font-size:12px;color:var(--text2);}
.exchange-stats{margin-left:auto;display:flex;gap:20px;}
.stat{text-align:right;}
.stat-val{font-size:20px;font-weight:700;font-family:var(--mono);}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
/* Categories */
.category{margin-bottom:32px;}
.cat-header{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
}
.cat-title{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text2);}
.cat-count{font-size:10px;font-family:var(--mono);color:var(--text3);padding:1px 6px;border-radius:3px;border:1px solid var(--border2);}
.cat-line{flex:1;height:1px;background:var(--border);}
/* Table */
.table-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  color:var(--text3);padding:10px 16px;text-align:left;
  border-bottom:1px solid var(--border);background:var(--card2);
}
th:last-child{text-align:right;}
td{padding:10px 16px;border-bottom:1px solid #0f0f0f;font-size:12px;vertical-align:middle;}
td:first-child{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--teal);}
td:nth-child(2){color:var(--text);font-size:13px;}
td.mono{font-family:var(--mono);color:var(--text2);}
td.margin-val{font-family:var(--mono);font-weight:600;color:var(--green);text-align:right;}
td:last-child{text-align:right;}
tr:last-child td{border:none;}
tr:hover td{background:#111;}
.note-chip{
  display:inline-block;padding:2px 8px;border-radius:4px;
  font-size:10px;background:#F59E0B18;color:#F59E0B;border:1px solid #F59E0B33;
}
</style>

                <td class="mono">${p.tick}</td>
                <td class="mono">${p.tickVal}</td>
                <td class="mono">${p.pointVal}</td>
                <td>${p.note?`<span class="note-chip">${p.note}</span>`:''}</td>
                <td class="mono">${p.notional}</td>
                <td class="margin-val">${p.margin}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `).join('')}
  `;
  content.appendChild(panel);
});
</script>
</body>
</html>
